name: Publish

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. 0.1.0
        required: true

jobs:
  publish:
    # Must be macOS: the iOS klibs carry a cinterop binding that cannot be produced anywhere else.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version"

      - name: Check before publishing
        run: ./gradlew spotlessCheck :lineloginkmp:checkKotlinAbi :lineloginkmp:allTests

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral -PVERSION_NAME=${{ steps.version.outputs.value }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # The deployment is staged, not released: promote it in the Central Portal once the
      # artifacts look right.
      - name: Next step
        run: echo "Staged. Promote the deployment at https://central.sonatype.com/publishing"
