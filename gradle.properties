# Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.parallel=true
# Kotlin
kotlin.code.style=official
# Multiplatform
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# Dokka
org.jetbrains.dokka.experimental.gradle.pluginMode=V2EnabledWithHelpers

# ── Publishing ───────────────────────────────────────────────────────────────────────────────
# Coordinates. `VERSION_NAME` is the single source of truth for the released version; the release
# workflow overrides it with -PVERSION_NAME=<tag>.
GROUP=dev.yjyoon.lineloginkmp
VERSION_NAME=0.1.0-SNAPSHOT

# POM metadata shared by every published module. Read automatically by
# com.vanniktech.maven.publish, so the convention plugin stays free of project-specific strings;
# each module adds its own POM_ARTIFACT_ID / POM_NAME / POM_DESCRIPTION.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/yjyoon-dev/line-login-kmp/

POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/yjyoon-dev/line-login-kmp/
POM_SCM_CONNECTION=scm:git:git://github.com/yjyoon-dev/line-login-kmp.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/yjyoon-dev/line-login-kmp.git

POM_DEVELOPER_ID=yjyoon
POM_DEVELOPER_NAME=Yeojun Yoon
POM_DEVELOPER_URL=https://yjyoon.dev
