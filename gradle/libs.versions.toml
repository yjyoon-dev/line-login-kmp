[versions]
android-minSdk = "24"
android-compileSdk = "36"
android-targetSdk = "36"

agp = "8.13.2"
kotlin = "2.4.0"
coroutines = "1.10.2"
compose = "1.11.1"
activity-compose = "1.13.0"
startup = "1.2.0"

# The two LINE SDKs live in separate repositories on independent release trains, so these version
# numbers deliberately do not match.
#
#   linesdk-android  Maven coordinate, resolved by Gradle like any other dependency.
#   linesdk-ios      The SPM version consumers add in Xcode, and the LineSDKObjC.xcframework
#                    release this library runs cinterop against. Changing it means updating the
#                    checksum in lineloginkmp/build.gradle.kts too.
linesdk-android = "5.13.0"
linesdk-ios = "5.17.0"

publish = "0.37.0"
spotless = "8.0.0"
ktlint = "1.7.1"
dokka = "2.2.0"

[libraries]
androidx-startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "startup" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

line-sdk = { module = "com.linecorp.linesdk:linesdk", version.ref = "linesdk-android" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# Declared explicitly, because the matching `compose.*` accessors are deprecated. material3 is the
# exception: it is published on its own version line (1.12.0-alpha03 while Compose is 1.11.1), so
# the accessor is what pairs the right one with the plugin.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose" }

# Consumed by gradle-conventions so the convention plugins can apply them.
spotlessGradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
mavenPublishGradlePlugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "publish" }
dokkaGradlePlugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "publish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

[bundles]
plugins = [
    "spotlessGradlePlugin",
    "mavenPublishGradlePlugin",
    "dokkaGradlePlugin",
]
