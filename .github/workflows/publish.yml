name: Publish

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. 0.1.0
        required: true

jobs:
  publish:
    # Must be macOS: the iOS klibs carry a cinterop binding that cannot be produced anywhere else.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version"

      - name: Check before publishing
        run: ./gradlew spotlessCheck checkKotlinAbi allTests

      # publishAndRelease, not publish: the deployment is released once Central has validated it,
      # so cutting a GitHub Release is the whole ritual. Validation still gates it — a rejected
      # deployment fails this step and nothing reaches Maven Central. Swap this for
      # `publishToMavenCentral` if you would rather promote each release by hand at
      # https://central.sonatype.com/publishing.
      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral -PVERSION_NAME=${{ steps.version.outputs.value }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Done
        run: |
          echo "Released ${{ steps.version.outputs.value }}."
          echo "It appears on https://central.sonatype.com within minutes and on Maven Central"
          echo "search within a few hours."
