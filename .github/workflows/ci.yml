name: CI

on:
  push:
    # develop is where work lands and main is what gets released, so both are worth guarding.
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# macos-26, not macos-15: Compose Multiplatform 1.11 links against UIKit symbols that only exist in
# the iOS 26 SDK, and macos-15's default Xcode is 16.4. On the older image the iOS link fails with
# "Undefined symbols: _OBJC_CLASS_$_UIViewLayoutRegion" — in the compose module's test binary and in
# the sample app alike.
jobs:
  # Runs first because it is the one that usually fails.
  library:
    # macOS, not Linux: the iOS targets and their cinterop against LineSDKObjC only build here.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Formatting
        run: ./gradlew spotlessCheck

      # Unscoped, so a module added later is covered without touching this file.
      - name: Public API has not changed unintentionally
        run: ./gradlew checkKotlinAbi

      - name: Tests
        run: ./gradlew allTests

      - name: Build libraries
        run: ./gradlew assemble

      # Catches packaging mistakes — a missing POM field, an unpublished artifact — without needing
      # credentials. The version must end in -SNAPSHOT: signAllPublications() makes signing
      # mandatory for anything else, and this job has no signing key.
      - name: Publish to Maven local
        run: ./gradlew publishToMavenLocal -PVERSION_NAME=0.0.0-SNAPSHOT

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            lineloginkmp/build/reports/tests
            lineloginkmp-compose/build/reports/tests

  # The integration gate: an app that adds LineSDKObjC through SPM must link the Kotlin framework.
  # Nothing else proves the iOS half actually works from a consumer's side.
  sample:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Android sample
        run: ./gradlew :sample:composeApp:assembleDebug

      # The web sample. A distribution build proves the wasm target links end to end — Kotlin,
      # Compose for Web, and the sample's own entry point — without needing a browser on this job;
      # the library job's tests already run in Chrome headless.
      - name: Web sample
        run: ./gradlew :sample:composeApp:wasmJsBrowserDistribution

      - name: iOS sample
        working-directory: sample/iosApp
        run: |
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      # The whole iOS design rests on this: the Kotlin framework references LINE's Objective-C
      # classes by their Swift-mangled names, and the app's own copy of LineSDKObjC has to define
      # them. A green xcodebuild alone would not prove it.
      - name: The Kotlin framework's LineSDKObjC references really did resolve
        working-directory: sample/iosApp
        run: |
          set -euo pipefail
          app=$(ls -d build/DerivedData/Build/Products/Debug-iphonesimulator/*.app | head -1)
          # Debug builds since Xcode 16 put the code in a companion dylib and leave a tiny stub
          # behind as the executable, so pick the dylib when it exists.
          binary="$app/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          [ -f "$binary.debug.dylib" ] && binary="$binary.debug.dylib"
          echo "Inspecting $binary"

          # Dumped to a file rather than piped: `grep -q` closes the pipe on its first match, and
          # LLVM's nm treats that as a fatal write error ("IO failure on output stream: Broken
          # pipe"), which pipefail then reports as a failed check on a perfectly linked binary.
          nm "$binary" > "$RUNNER_TEMP/symbols.txt"
          nm -u "$binary" > "$RUNNER_TEMP/undefined.txt"

          undefined=$(grep -c LineSDKObjC "$RUNNER_TEMP/undefined.txt" || true)
          if [ "$undefined" != "0" ]; then
            echo "::error::$undefined LineSDKObjC symbols are still undefined in the app binary"
            grep LineSDKObjC "$RUNNER_TEMP/undefined.txt" || true
            exit 1
          fi
          if ! grep -F -q '_OBJC_CLASS_$__TtC11LineSDKObjC19LineSDKLoginManager' "$RUNNER_TEMP/symbols.txt"; then
            echo "::error::LineSDKObjC was not linked into the app at all"
            exit 1
          fi
          echo "LineSDKObjC linked into the app as expected"
