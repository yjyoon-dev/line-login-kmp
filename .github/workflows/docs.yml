name: API docs

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  dokka:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Unscoped: the root project aggregates both published modules, so the site covers the whole
      # API. Scoping this to one module silently drops the other one's documentation.
      - name: Generate API documentation
        run: ./gradlew dokkaGenerate

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/dokka/html

      - uses: actions/deploy-pages@v4
